<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Bangers&family=Russo+One&family=Black+Ops+One&family=Bebas+Neue&family=Luckiest+Guy&display=swap">
<style>
/* OBS browser source for Streaming › Overlays (every counter and box).
   1400x500, see-through background: only the box and its animations show.
   kind=money|kd|game|winloss|timer|goal|challenge|discord|ticker,
   g=<server id>, api=<api url>: it checks every second.
   preview=1 (dashboard): takes everything by postMessage:
   {type:"counter", settings, values} to change, {type:"counter-demo", key, diff}
   to play an animation without changing it, {type:"counter-streak"} for a banner. */
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body.preview { background: repeating-conic-gradient(#3a3d44 0 25%, #30333a 0 50%) 0 0 / 40px 40px; }
#root { position: fixed; inset: 0; transition: opacity .4s; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/overlays/counter-engine.js"></script>
<script>
const q = new URLSearchParams(location.search);
const KINDS = ["money", "kd", "game", "winloss", "timer", "goal", "challenge", "discord", "ticker"];
const kind = KINDS.includes(q.get("kind")) ? q.get("kind") : "money";
if (q.get("preview") === "1") document.body.classList.add("preview");
const fx = CounterFX.mount(document.getElementById("root"));
const START = { kd: { anim: "bullets", spot: "above", font: "blackops" } };
fx.set({ kind, ...(START[kind] || {}) }, kind === "kd" ? { kills: Number(q.get("kills")) || 0, deaths: Number(q.get("deaths")) || 0, streak: 0 } : { amount: Number(q.get("amount")) || 0 });

// The numbers for each kind; everything else is the look.
const VALUES = {
  money: ["amount"], kd: ["kills", "deaths", "streak"], game: ["game"], winloss: ["wins", "losses", "streak"], timer: ["timer"],
  goal: ["cur", "target"], challenge: ["count"], discord: ["members", "online"], ticker: ["type", "name", "recent"],
};
function split(r) {
  // Hidden on stream (dashboard or Stream Deck): fade out, keep everything.
  document.getElementById("root").style.opacity = r.hidden ? "0" : "1";
  const look = { ...r, kind };
  delete look.hidden;
  const values = {};
  for (const k of VALUES[kind]) { values[k] = r[k]; delete look[k]; }
  // Line the timer up with the server's clock, in case this PC's clock is off.
  if (kind === "timer" && r.timer && r.now) values.timer = { ...r.timer, t0: r.timer.t0 + (Date.now() - r.now) };
  return [look, values];
}

window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "counter") fx.set({ ...e.data.settings, kind }, e.data.values);
  if (e.data.type === "counter-demo") fx.demo(e.data.key, Number(e.data.diff) || 1);
  if (e.data.type === "counter-streak") fx.streakDemo();
});

(async () => {
  await document.fonts.ready.catch(() => null);
  if (q.get("g") && q.get("api")) {
    const path = kind === "money" ? "money-counter" : kind === "kd" ? "kd-counter" : `overlay/${kind}`;
    const url = `${q.get("api")}/public/${path}/${q.get("g")}`;
    const load = () => fetch(url, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((r) => r && fx.set(...split(r))).catch(() => null);
    await load();
    fx.start();
    setInterval(load, 1000);
  } else {
    fx.start();
  }
})();
</script>
</body>
</html>
