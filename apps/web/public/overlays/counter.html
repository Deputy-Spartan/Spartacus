<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Counter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Bangers&family=Russo+One&family=Black+Ops+One&family=Bebas+Neue&family=Luckiest+Guy&display=swap">
<style>
/* OBS browser source for Streaming › Money Counter and K/D Counter.
   1400x500, see-through background: only the box and its animations show.
   kind=money|kd, g=<server id>, api=<api url>: it checks every second.
   preview=1 (dashboard): starts from amount= / kills= / deaths= and takes
   the rest by postMessage: {type:"counter", settings, values} to change,
   {type:"counter-demo", key, diff} to play an animation without changing it,
   {type:"counter-streak"} to show a kill streak banner. */
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body.preview { background: repeating-conic-gradient(#3a3d44 0 25%, #30333a 0 50%) 0 0 / 40px 40px; }
#root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/overlays/counter-engine.js"></script>
<script>
const q = new URLSearchParams(location.search);
const kind = q.get("kind") === "kd" ? "kd" : "money";
if (q.get("preview") === "1") document.body.classList.add("preview");
const fx = CounterFX.mount(document.getElementById("root"));
const KD_DEFAULTS = { anim: "bullets", spot: "above", font: "blackops" };
fx.set({ kind, ...(kind === "kd" ? KD_DEFAULTS : {}) }, kind === "kd" ? { kills: Number(q.get("kills")) || 0, deaths: Number(q.get("deaths")) || 0, streak: 0 } : { amount: Number(q.get("amount")) || 0 });

// Splits what the API sends into the look and the numbers.
function split(r) {
  const { amount, kills, deaths, streak, ...look } = r;
  return [{ ...look, kind }, kind === "kd" ? { kills, deaths, streak } : { amount }];
}

window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "counter") fx.set({ ...e.data.settings, kind }, e.data.values);
  if (e.data.type === "counter-demo") fx.demo(e.data.key, Number(e.data.diff) || 1);
  if (e.data.type === "counter-streak") fx.streakDemo();
});

(async () => {
  await document.fonts.ready.catch(() => null);
  if (q.get("g") && q.get("api")) {
    const url = `${q.get("api")}/public/${kind === "kd" ? "kd" : "money"}-counter/${q.get("g")}`;
    const load = () => fetch(url, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((r) => r && fx.set(...split(r))).catch(() => null);
    await load();
    fx.start();
    setInterval(load, 1000);
  } else {
    fx.start();
  }
})();
</script>
</body>
</html>
