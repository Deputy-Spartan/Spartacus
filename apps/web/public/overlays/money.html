<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Money Counter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
/* OBS browser source (Streaming › Money Counter), 1400x500, see-through.
   The box sits in the middle, with room around it for the +$ / -$ amount.
   From the dashboard: g=<server id>&api=<api url>, and it checks every second.
   Preview: preview=1&amount=..&label=..&prefix=..&suffix=..&size=..&anim=..&spot=..
   and the dashboard sends changes with postMessage so they animate.
   anim = bounce | float | slam | burst | slot
   spot = right | left | above | below | over | corner (where the amount shows) */
:root { --gold: #f9c933; --up: #4ade80; --down: #f87171; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body.preview { background: repeating-conic-gradient(#3a3d44 0 25%, #30333a 0 50%) 0 0 / 40px 40px; }
.place { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(var(--scale, 1)); }
/* Amount on one side: shift the box the other way so the amount has room. */
.place.at-right { left: 36%; }
.place.at-left { left: 64%; }
.overlay { position: relative; }
.overlay.bob { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-14px) rotate(.6deg); } }
.box {
  position: relative; display: inline-flex; flex-direction: column; align-items: center;
  padding: 12px 36px 16px; border-radius: 20px;
  background: linear-gradient(180deg, #2a2a2a 0%, #151515 100%);
  border: 3px solid #050505;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.09), 0 10px 22px rgba(0,0,0,.5);
  font-family: "Lilita One", "Arial Black", sans-serif; line-height: 1; white-space: nowrap;
  opacity: 0;
}
.label { font-size: 30px; letter-spacing: .1em; color: #fff; text-transform: uppercase; -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
.label:empty { display: none; }
.num { display: flex; font-size: 104px; margin-top: 2px; color: var(--gold); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 12px #111; paint-order: stroke fill; text-shadow: 0 6px 0 #111; transition: color .2s; }
.num.flash-up { color: var(--up); }
.num.flash-down { color: var(--down); }
/* Slot machine: each digit is a strip of 0-9 that rolls */
.col { display: inline-block; height: 1.12em; overflow: hidden; }
.strip { display: flex; flex-direction: column; }
.strip span, .ch { height: 1.12em; line-height: 1.12em; }

/* .spot places the amount; .delta inside it does the moving. */
.spot { position: absolute; pointer-events: none; z-index: 2; }
.spot.right { left: 100%; top: 50%; transform: translateY(-50%); margin-left: 18px; }
.spot.left { right: 100%; top: 50%; transform: translateY(-50%); margin-right: 18px; }
.spot.above { bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 8px; }
.spot.below { top: 100%; left: 50%; transform: translateX(-50%); margin-top: 12px; }
.spot.over { top: 62%; left: 50%; transform: translate(-50%, -50%); }
.spot.corner { top: 0; right: 0; transform: translate(35%, -65%) rotate(8deg); }
.spot.corner .delta { font-size: 44px; }
.delta { display: block; font-family: "Lilita One", "Arial Black", sans-serif; font-size: 62px; line-height: 1; white-space: nowrap;
  -webkit-text-stroke: 10px #000; paint-order: stroke fill; text-shadow: 0 5px 0 #000; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.bit { position: absolute; left: 50%; top: 60%; font-family: "Lilita One", "Arial Black", sans-serif; font-size: 46px; -webkit-text-stroke: 8px #000; paint-order: stroke fill; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .overlay.bob { animation: none; } }
</style>
</head>
<body>
<div class="place" id="place"><div class="overlay" id="overlay"><div class="box" id="box"><div class="label" id="label"></div><div class="num" id="num"></div></div></div></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get("preview") === "1") document.body.classList.add("preview");
const box = document.getElementById("box");
const place = document.getElementById("place");
const overlay = document.getElementById("overlay");
const labelEl = document.getElementById("label");
const numEl = document.getElementById("num");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let s = {
  amount: Number(q.get("amount")) || 0, label: q.get("label") ?? "TOTAL MONEY", prefix: q.get("prefix") ?? "$", suffix: q.get("suffix") ?? "",
  size: Number(q.get("size")) || 100, anim: q.get("anim") || "bounce", spot: q.get("spot") || "right",
};
let shown = s.amount; // the number on screen right now
let started = false;
let raf = 0;

const fmt = (n) => `${n < 0 ? "-" : ""}${s.prefix}${Math.abs(Math.round(n)).toLocaleString("en-US")}${s.suffix}`;

function drawLook() {
  labelEl.textContent = s.label;
  place.style.setProperty("--scale", String(Math.max(0.3, Math.min(2.5, s.size / 100))));
  place.className = "place" + (s.spot === "right" ? " at-right" : s.spot === "left" ? " at-left" : "");
  overlay.classList.toggle("bob", s.anim === "float");
}

// Plain text for most styles; spinning digit strips for the slot machine.
function drawNumber(n, prevText) {
  const text = fmt(n);
  if (s.anim !== "slot" || prevText === undefined) { numEl.textContent = text; return; }
  numEl.textContent = "";
  const strips = [];
  [...text].forEach((ch, i) => {
    if (!/\d/.test(ch)) { const c = document.createElement("span"); c.className = "ch"; c.textContent = ch; numEl.appendChild(c); return; }
    // Digits are matched by place from the right, so $9,900 -> $10,000 rolls right.
    const old = prevText[prevText.length - (text.length - i)];
    const start = /\d/.test(old ?? "") ? Number(old) : 0;
    const col = document.createElement("span");
    col.className = "col";
    const strip = document.createElement("span");
    strip.className = "strip";
    for (let d = 0; d <= 9; d++) { const c = document.createElement("span"); c.textContent = d; strip.appendChild(c); }
    strip.style.transform = `translateY(${-start * 1.12}em)`;
    col.appendChild(strip);
    numEl.appendChild(col);
    strips.push([strip, Number(ch), i]);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    for (const [strip, d, i] of strips) {
      strip.style.transition = reduce ? "none" : `transform ${0.7 + (strips.length - i) * 0.04}s cubic-bezier(.2,.9,.25,1.15)`;
      strip.style.transform = `translateY(${-d * 1.12}em)`;
    }
  }));
}

function countTo(to) {
  const from = shown;
  cancelAnimationFrame(raf);
  if (reduce) { shown = to; numEl.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / 900);
    shown = from + (to - from) * (1 - Math.pow(1 - k, 3));
    numEl.textContent = fmt(k === 1 ? to : shown);
    if (k < 1) raf = requestAnimationFrame(step); else shown = to;
  };
  raf = requestAnimationFrame(step);
}

let flashTimer = 0;
function flash(diff, ms) {
  clearTimeout(flashTimer);
  numEl.classList.remove("flash-up", "flash-down");
  numEl.classList.add(diff > 0 ? "flash-up" : "flash-down");
  flashTimer = setTimeout(() => numEl.classList.remove("flash-up", "flash-down"), ms);
}

// The green +$ / red -$ amount, in the chosen spot.
function makeDelta(diff) {
  const sp = document.createElement("div");
  sp.className = "spot " + s.spot;
  const d = document.createElement("div");
  d.className = "delta " + (diff > 0 ? "up" : "down");
  d.textContent = `${diff > 0 ? "+" : "-"}${s.prefix}${Math.abs(Math.round(diff)).toLocaleString("en-US")}${s.suffix}`;
  sp.appendChild(d);
  box.appendChild(sp);
  d._spot = sp;
  return d;
}
const done = (a, el) => {
  const gone = () => (el._spot ?? el).remove();
  a.finished.then(gone).catch(gone);
};

const ANIM = {
  bounce(diff) {
    countTo(s.amount);
    box.animate([
      { transform: "translateY(0) scale(1)" },
      { transform: "translateY(-28px) scale(1.04, .96)", offset: .3 },
      { transform: "translateY(0) scale(1.06, .92)", offset: .55 },
      { transform: "translateY(-10px) scale(.98, 1.02)", offset: .75 },
      { transform: "translateY(0) scale(1)" },
    ], { duration: 650, easing: "ease-out" });
    const d = makeDelta(diff);
    done(d.animate([
      { opacity: 0, transform: "translateY(0) scale(.3)" },
      { opacity: 1, transform: "translateY(0) scale(1.35)", offset: .15 },
      { opacity: 1, transform: "translateY(0) scale(.9)", offset: .25 },
      { opacity: 1, transform: "translateY(0) scale(1.08)", offset: .33 },
      { opacity: 1, transform: "translateY(0) scale(1)", offset: .6 },
      { opacity: 0, transform: "translateY(-140%) scale(1)" },
    ], { duration: 2000, easing: "ease-out", fill: "forwards" }), d);
  },
  float(diff) {
    countTo(s.amount);
    flash(diff, 700);
    const d = makeDelta(diff);
    done(d.animate([
      { opacity: 0, transform: "translate(0, -20%) rotate(0)" },
      { opacity: 1, transform: "translate(8px, -70%) rotate(-5deg)", offset: .2 },
      { opacity: 1, transform: "translate(-8px, -130%) rotate(5deg)", offset: .45 },
      { opacity: 1, transform: "translate(8px, -190%) rotate(-4deg)", offset: .7 },
      { opacity: 0, transform: "translate(0, -260%) rotate(0)" },
    ], { duration: 2600, easing: "ease-in-out", fill: "forwards" }), d);
  },
  slam(diff) {
    const d = makeDelta(diff);
    done(d.animate([
      { opacity: 0, transform: "translateY(-260%) scale(2.2)" },
      { opacity: 1, transform: "translateY(0) scale(1)", offset: .18 },
      { opacity: 1, transform: "translateY(0) scale(1.15, .85)", offset: .24 },
      { opacity: 1, transform: "translateY(0) scale(1)", offset: .32 },
      { opacity: 1, transform: "translateY(0) scale(1)", offset: .75 },
      { opacity: 0, transform: "translateY(0) scale(.6)" },
    ], { duration: 1900, easing: "ease-in", fill: "forwards" }), d);
    setTimeout(() => {
      countTo(s.amount);
      flash(diff, 900);
      box.animate([
        { transform: "translate(0,0) rotate(0)" }, { transform: "translate(-12px,6px) rotate(-2deg)" }, { transform: "translate(10px,-4px) rotate(2deg)" },
        { transform: "translate(-8px,4px) rotate(-1deg)" }, { transform: "translate(6px,0) rotate(1deg)" }, { transform: "translate(0,0) rotate(0)" },
      ], { duration: 420, easing: "linear" });
    }, 330);
  },
  burst(diff) {
    countTo(s.amount);
    flash(diff, 600);
    numEl.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" });
    const color = diff > 0 ? "var(--up)" : "var(--down)";
    for (let i = 0; i < 16; i++) {
      const b = document.createElement("div");
      b.className = "bit";
      b.textContent = i % 3 === 0 ? (diff > 0 ? "+" : "-") : s.prefix.trim() || "$";
      b.style.color = color;
      box.appendChild(b);
      const ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
      const dist = 140 + Math.random() * 130;
      const x = Math.cos(ang) * dist, y = Math.sin(ang) * dist * 0.7;
      done(b.animate([
        { opacity: 1, transform: "translate(-50%,-50%) scale(.4)" },
        { opacity: 1, transform: `translate(calc(-50% + ${x * .7}px), calc(-50% + ${y * .7 - 40}px)) scale(1.1) rotate(${x / 6}deg)`, offset: .45 },
        { opacity: 0, transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y + 60}px)) scale(.8) rotate(${x / 4}deg)` },
      ], { duration: 900 + Math.random() * 300, easing: "cubic-bezier(.2,.7,.4,1)", fill: "forwards" }), b);
    }
    const d = makeDelta(diff);
    done(d.animate([
      { opacity: 0, transform: "translateY(0) scale(0) rotate(-12deg)" },
      { opacity: 1, transform: "translateY(0) scale(1.25) rotate(4deg)", offset: .2 },
      { opacity: 1, transform: "translateY(0) scale(1) rotate(0)", offset: .35 },
      { opacity: 1, transform: "translateY(-12%) scale(1)", offset: .7 },
      { opacity: 0, transform: "translateY(-100%) scale(1)" },
    ], { duration: 1900, easing: "ease-out", fill: "forwards" }), d);
  },
  slot(diff, prevText) {
    cancelAnimationFrame(raf);
    shown = s.amount;
    drawNumber(s.amount, prevText);
    setTimeout(() => flash(diff, 600), 650);
    const d = makeDelta(diff);
    done(d.animate([
      { opacity: 0, transform: "translateY(50%)" },
      { opacity: 1, transform: "translateY(0)", offset: .15 },
      { opacity: 1, transform: "translateY(0)", offset: .6 },
      { opacity: 0, transform: "translateY(-150%)" },
    ], { duration: 2000, easing: "ease-out", fill: "forwards" }), d);
  },
};

function apply(next) {
  const old = s;
  s = { ...s, ...next };
  if (!ANIM[s.anim]) s.anim = "bounce";
  drawLook();
  if (!started || old.amount === s.amount) {
    // Look changes (or first load): redraw without a celebration.
    if (!started) shown = s.amount;
    if (!started || old.prefix !== s.prefix || old.suffix !== s.suffix || old.anim !== s.anim) { cancelAnimationFrame(raf); shown = s.amount; numEl.textContent = fmt(shown); }
    return;
  }
  const diff = s.amount - old.amount;
  const prevText = `${old.amount < 0 ? "-" : ""}${s.prefix}${Math.abs(Math.round(old.amount)).toLocaleString("en-US")}${s.suffix}`;
  ANIM[s.anim](diff, prevText);
}

function start() {
  started = true;
  box.animate([{ opacity: 0, transform: "translateY(-16px) scale(.9)" }, { opacity: 1, transform: "translateY(2px) scale(1.03)", offset: 0.7 }, { opacity: 1, transform: "none" }], { duration: 450, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
}

// The dashboard preview sends changes this way, so you see them animate.
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "money") apply(e.data.value);
  // "Try it": plays the animation with a pretend amount; the total stays the same.
  if (e.data.type === "money-demo" && started) ANIM[s.anim](Number(e.data.diff) || 100000, fmt(s.amount));
});

(async () => {
  apply({});
  await document.fonts.ready.catch(() => null);
  if (q.get("g") && q.get("api")) {
    const url = `${q.get("api")}/public/money-counter/${q.get("g")}`;
    const load = () => fetch(url, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((v) => v && apply(v)).catch(() => null);
    await load();
    start();
    setInterval(load, 1000);
  } else {
    start();
  }
})();
</script>
</body>
</html>
