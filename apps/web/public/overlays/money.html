<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Money Counter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
/* OBS browser source (Streaming › Money Counter), 1400x500, see-through
   background: only the box and its animations show on stream.
   From the dashboard: g=<server id>&api=<api url>, and it checks every second.
   Preview: preview=1&amount=.. and the dashboard sends the rest with
   postMessage ({type:"money", value}) so changes animate, and
   {type:"money-demo", diff} plays an animation without changing the total.
   Settings (packages/shared/moneyCounter.ts): anim, spot, look, color, dstyle,
   dsize, speed, bigwin, short, label, prefix, suffix, size. */
:root { --gold: #f9c933; --up: #4ade80; --down: #f87171; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body.preview { background: repeating-conic-gradient(#3a3d44 0 25%, #30333a 0 50%) 0 0 / 40px 40px; }
.place { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(var(--scale, 1)); }
/* Amount on one side: shift the box the other way so the amount has room. */
.place.at-right { left: 36%; }
.place.at-left { left: 64%; }
.overlay { position: relative; }
.overlay.bob { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-14px) rotate(.6deg); } }

/* The box, with its looks */
.box {
  --numc: var(--gold);
  position: relative; display: inline-flex; flex-direction: column; align-items: center;
  padding: 12px 36px 16px; border-radius: 20px;
  background: linear-gradient(180deg, #2a2a2a 0%, #151515 100%);
  border: 3px solid #050505;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.09), 0 10px 22px rgba(0,0,0,.5);
  font-family: "Lilita One", "Arial Black", sans-serif; line-height: 1; white-space: nowrap;
  opacity: 0; transition: box-shadow .3s;
}
.box.look-gold { background: linear-gradient(180deg, #ffe07a 0%, #e0a91e 60%, #b07b0c 100%); border-color: #5a3d00; box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 10px 22px rgba(0,0,0,.5); }
.box.look-gold .label { color: #3a2600; -webkit-text-stroke: 0; }
.box.look-neon { background: #0b0d14; border: 3px solid #22d3ee; box-shadow: 0 0 18px #22d3ee, 0 0 50px rgba(34,211,238,.45), inset 0 0 22px rgba(34,211,238,.25); }
.box.look-neon .label { color: #a5f3fc; }
.box.look-clean { background: #f6f6f4; border: 3px solid #1a1a1a; box-shadow: 0 10px 22px rgba(0,0,0,.4); }
.box.look-clean .label { color: #1a1a1a; -webkit-text-stroke: 0; }
.box.look-glass { background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); box-shadow: 0 10px 30px rgba(0,0,0,.35); backdrop-filter: blur(10px); }
.box.look-none { background: none; border-color: transparent; box-shadow: none; }
.box.jackpot { box-shadow: 0 0 0 5px var(--gold), 0 0 60px var(--gold), 0 0 120px rgba(249,201,51,.6); }
.label { font-size: 30px; letter-spacing: .1em; color: #fff; text-transform: uppercase; -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
.label:empty { display: none; }
.num { display: flex; font-size: 104px; margin-top: 2px; color: var(--numc); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 12px #111; paint-order: stroke fill; text-shadow: 0 6px 0 #111; transition: color .2s; }
.num.flash-up { color: var(--up); }
.num.flash-down { color: var(--down); }
/* Slot machine: each digit is a strip of 0-9 that rolls */
.col { display: inline-block; height: 1.12em; overflow: hidden; }
.strip { display: flex; flex-direction: column; }
.strip span, .ch { height: 1.12em; line-height: 1.12em; }

/* .spot places the +$ / -$; .delta inside it does the moving. */
.spot { --dscale: 1; position: absolute; pointer-events: none; z-index: 2; }
.spot.right { left: 100%; top: 50%; transform: translateY(-50%); margin-left: 18px; }
.spot.left { right: 100%; top: 50%; transform: translateY(-50%); margin-right: 18px; }
.spot.above { bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 8px; }
.spot.below { top: 100%; left: 50%; transform: translateX(-50%); margin-top: 12px; }
.spot.over { top: 62%; left: 50%; transform: translate(-50%, -50%); }
.spot.corner { top: 0; right: 0; transform: translate(35%, -65%) rotate(8deg); --dscale: .72; }
.delta { display: block; font-family: "Lilita One", "Arial Black", sans-serif; font-size: calc(62px * var(--dscale) * var(--dsize, 1)); line-height: 1; white-space: nowrap;
  -webkit-text-stroke: 10px #000; paint-order: stroke fill; text-shadow: 0 5px 0 #000; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.pill { -webkit-text-stroke: 0; text-shadow: none; color: #04130a; background: var(--up); border: 4px solid #000; border-radius: 999px; padding: .12em .5em .18em; box-shadow: 0 6px 0 #000; }
.delta.pill.down { color: #1f0606; background: var(--down); }
.bit { position: absolute; left: 50%; top: 60%; font-family: "Lilita One", "Arial Black", sans-serif; font-size: 46px; -webkit-text-stroke: 8px #000; paint-order: stroke fill; pointer-events: none; }
.drop { position: fixed; top: -80px; font-size: 60px; pointer-events: none; z-index: 1; }
.fly { position: absolute; left: 50%; top: 50%; font-size: 60px; pointer-events: none; }
.spark { position: absolute; font-size: 42px; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .overlay.bob { animation: none; } }
</style>
</head>
<body>
<div class="place" id="place"><div class="overlay" id="overlay"><div class="box" id="box"><div class="label" id="label"></div><div class="num" id="num"></div></div></div></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get("preview") === "1") document.body.classList.add("preview");
const $ = (id) => document.getElementById(id);
const box = $("box"), place = $("place"), overlay = $("overlay"), labelEl = $("label"), numEl = $("num");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ANIMS = ["bounce", "float", "slam", "burst", "slot", "pop", "rain", "jackpot"];

let s = {
  amount: Number(q.get("amount")) || 0, label: "TOTAL MONEY", prefix: "$", suffix: "", size: 100,
  anim: "bounce", spot: "right", look: "dark", color: "#f9c933", dstyle: "text", dsize: 1, speed: 1, bigwin: true, short: false,
};
let shown = s.amount; // the number on screen right now
let started = false;
let raf = 0;

// ---- Numbers ----
const longNum = (n) => Math.abs(Math.round(n)).toLocaleString("en-US");
function shortNum(n) {
  const a = Math.abs(n);
  const [d, u] = a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : a >= 1e4 ? [1e3, "K"] : [1, ""];
  return d === 1 ? Math.round(a).toLocaleString("en-US") : (a / d).toFixed(a / d >= 100 ? 0 : 1).replace(/\.0$/, "") + u;
}
const body = (n) => (s.short ? shortNum(n) : longNum(n));
const fmt = (n) => `${n < 0 ? "-" : ""}${s.prefix}${body(n)}${s.suffix}`;
const deltaText = (diff) => `${diff > 0 ? "+" : "-"}${s.prefix}${body(diff)}${s.suffix}`;
const speed = () => Number(s.speed) || 1;
const later = (fn, ms) => setTimeout(fn, ms / speed());

function drawLook() {
  labelEl.textContent = s.label;
  place.style.setProperty("--scale", String(Math.max(0.3, Math.min(2.5, s.size / 100))));
  place.className = "place" + (s.spot === "right" ? " at-right" : s.spot === "left" ? " at-left" : "");
  overlay.classList.toggle("bob", s.anim === "float");
  box.classList.remove("look-dark", "look-gold", "look-neon", "look-clean", "look-glass", "look-none");
  box.classList.add("look-" + s.look);
  box.style.setProperty("--numc", s.color);
  box.style.setProperty("--dsize", String(s.dsize));
}

function drawSlot(n, prevText) {
  const text = fmt(n);
  numEl.textContent = "";
  const strips = [];
  [...text].forEach((ch, i) => {
    if (!/\d/.test(ch)) { const c = document.createElement("span"); c.className = "ch"; c.textContent = ch; numEl.appendChild(c); return; }
    // Digits are matched by place from the right, so $9,900 -> $10,000 rolls right.
    const old = prevText[prevText.length - (text.length - i)];
    const start = /\d/.test(old ?? "") ? Number(old) : 0;
    const col = document.createElement("span"); col.className = "col";
    const strip = document.createElement("span"); strip.className = "strip";
    for (let d = 0; d <= 9; d++) { const c = document.createElement("span"); c.textContent = d; strip.appendChild(c); }
    strip.style.transform = `translateY(${-start * 1.12}em)`;
    col.appendChild(strip); numEl.appendChild(col);
    strips.push([strip, Number(ch), i]);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    for (const [strip, d, i] of strips) {
      strip.style.transition = reduce ? "none" : `transform ${(0.7 + (strips.length - i) * 0.04) / speed()}s cubic-bezier(.2,.9,.25,1.15)`;
      strip.style.transform = `translateY(${-d * 1.12}em)`;
    }
  }));
}

function countTo(to) {
  const from = shown;
  cancelAnimationFrame(raf);
  if (reduce) { shown = to; numEl.textContent = fmt(to); return; }
  const t0 = performance.now(), ms = 900 / speed();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / ms);
    shown = from + (to - from) * (1 - Math.pow(1 - k, 3));
    numEl.textContent = fmt(k === 1 ? to : shown);
    if (k < 1) raf = requestAnimationFrame(step); else shown = to;
  };
  raf = requestAnimationFrame(step);
}

let flashTimer = 0;
function flash(diff, ms) {
  clearTimeout(flashTimer);
  numEl.classList.remove("flash-up", "flash-down");
  numEl.classList.add(diff > 0 ? "flash-up" : "flash-down");
  flashTimer = setTimeout(() => numEl.classList.remove("flash-up", "flash-down"), ms / speed());
}

// ---- The green +$ / red -$ amount, in the chosen spot ----
function makeDelta(diff) {
  const sp = document.createElement("div");
  sp.className = "spot " + s.spot;
  const d = document.createElement("div");
  d.className = "delta " + (diff > 0 ? "up" : "down") + (s.dstyle === "pill" ? " pill" : "");
  d.textContent = deltaText(diff);
  sp.appendChild(d);
  box.appendChild(sp);
  d._spot = sp;
  return d;
}
const done = (a, el) => { const gone = () => (el._spot ?? el).remove(); a.finished.then(gone).catch(gone); };
const play = (el, frames, opts) => { const a = el.animate(frames, { fill: "forwards", ...opts }); a.playbackRate = speed(); return a; };
const rnd = () => Math.random() * 2 - 1;

// ---- The animations ----
const ANIM = {
  bounce(diff) {
    countTo(s.amount);
    play(box, [
      { transform: "translateY(0) scale(1)" }, { transform: "translateY(-28px) scale(1.04,.96)", offset: .3 },
      { transform: "translateY(0) scale(1.06,.92)", offset: .55 }, { transform: "translateY(-10px) scale(.98,1.02)", offset: .75 }, { transform: "none" },
    ], { duration: 650, easing: "ease-out", fill: "none" });
    const d = makeDelta(diff);
    done(play(d, [
      { opacity: 0, transform: "scale(.3)" }, { opacity: 1, transform: "scale(1.35)", offset: .15 }, { opacity: 1, transform: "scale(.9)", offset: .25 },
      { opacity: 1, transform: "scale(1.08)", offset: .33 }, { opacity: 1, transform: "scale(1)", offset: .6 }, { opacity: 0, transform: "translateY(-140%)" },
    ], { duration: 2000, easing: "ease-out" }), d);
  },
  float(diff) {
    countTo(s.amount); flash(diff, 700);
    const d = makeDelta(diff);
    done(play(d, [
      { opacity: 0, transform: "translate(0,-20%) rotate(0)" }, { opacity: 1, transform: "translate(8px,-70%) rotate(-5deg)", offset: .2 },
      { opacity: 1, transform: "translate(-8px,-130%) rotate(5deg)", offset: .45 }, { opacity: 1, transform: "translate(8px,-190%) rotate(-4deg)", offset: .7 },
      { opacity: 0, transform: "translate(0,-260%) rotate(0)" },
    ], { duration: 2600, easing: "ease-in-out" }), d);
  },
  slam(diff) {
    const d = makeDelta(diff);
    done(play(d, [
      { opacity: 0, transform: "translateY(-260%) scale(2.2)" }, { opacity: 1, transform: "scale(1)", offset: .18 }, { opacity: 1, transform: "scale(1.15,.85)", offset: .24 },
      { opacity: 1, transform: "scale(1)", offset: .32 }, { opacity: 1, transform: "scale(1)", offset: .75 }, { opacity: 0, transform: "scale(.6)" },
    ], { duration: 1900, easing: "ease-in" }), d);
    later(() => { countTo(s.amount); flash(diff, 900); shake(); }, 330);
  },
  burst(diff) {
    countTo(s.amount); flash(diff, 600);
    play(numEl, [{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out", fill: "none" });
    bits(diff > 0 ? "var(--up)" : "var(--down)", (i) => (i % 3 === 0 ? (diff > 0 ? "+" : "-") : s.prefix.trim() || "$"), 16);
    const d = makeDelta(diff);
    done(play(d, [
      { opacity: 0, transform: "scale(0) rotate(-12deg)" }, { opacity: 1, transform: "scale(1.25) rotate(4deg)", offset: .2 },
      { opacity: 1, transform: "scale(1) rotate(0)", offset: .35 }, { opacity: 1, transform: "translateY(-12%)", offset: .7 }, { opacity: 0, transform: "translateY(-100%)" },
    ], { duration: 1900, easing: "ease-out" }), d);
  },
  slot(diff, prevText) {
    cancelAnimationFrame(raf);
    shown = s.amount;
    drawSlot(s.amount, prevText);
    later(() => flash(diff, 600), 650);
    rise(diff);
  },
  pop(diff) {
    countTo(s.amount); flash(diff, 800);
    play(numEl, [
      { transform: "scale(1) rotate(0)" }, { transform: "scale(1.35) rotate(-4deg)", offset: .25 }, { transform: "scale(1.2) rotate(4deg)", offset: .45 },
      { transform: "scale(1.25) rotate(-2deg)", offset: .6 }, { transform: "scale(1) rotate(0)" },
    ], { duration: 800, easing: "ease-out", fill: "none" });
    const d = makeDelta(diff);
    done(play(d, [
      { opacity: 0, transform: "scale(.5)" }, { opacity: 1, transform: "scale(1.2)", offset: .15 }, { opacity: 1, transform: "scale(1)", offset: .25 },
      { opacity: 1, transform: "scale(1)", offset: .75 }, { opacity: 0, transform: "scale(.8)" },
    ], { duration: 1800, easing: "ease-out" }), d);
  },
  rain(diff) {
    countTo(s.amount); flash(diff, 800);
    const w = window.innerWidth, h = window.innerHeight;
    for (let i = 0; i < 22; i++) {
      const e = document.createElement("div");
      if (diff > 0) {
        // Adding: bills rain down over the whole canvas.
        e.className = "drop";
        e.textContent = "💵";
        e.style.left = Math.random() * 95 + "%";
        document.body.appendChild(e);
        done(play(e, [
          { transform: `translateY(0) rotate(${Math.random() * 60 - 30}deg)` },
          { transform: `translate(${rnd() * 40}px, ${h + 160}px) rotate(${rnd() * 180}deg)` },
        ], { duration: 1400 + Math.random() * 900, delay: Math.random() * 500, easing: "cubic-bezier(.4,.1,.7,1)" }), e);
      } else {
        // Taking away: bills fly off from the box.
        e.className = "fly";
        e.textContent = "💸";
        box.appendChild(e);
        const x = rnd() * w * 0.4, y = -Math.random() * h * 0.45 - 40;
        done(play(e, [
          { transform: "translate(-50%,-50%) scale(.5)", opacity: 1 },
          { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1) rotate(${x / 6}deg)`, opacity: 0 },
        ], { duration: 1200 + Math.random() * 500, delay: Math.random() * 300, easing: "ease-out" }), e);
      }
    }
    rise(diff);
  },
  jackpot(diff) {
    countTo(s.amount); flash(diff, 1200);
    glow(1500);
    shake();
    sparkles(diff > 0 ? "✨" : "💥");
    const d = makeDelta(diff);
    done(play(d, [
      { opacity: 0, transform: "scale(0) rotate(-20deg)" }, { opacity: 1, transform: "scale(1.5) rotate(6deg)", offset: .18 },
      { opacity: 1, transform: "scale(1.1) rotate(-3deg)", offset: .3 }, { opacity: 1, transform: "scale(1.2) rotate(0)", offset: .7 }, { opacity: 0, transform: "translateY(-120%) scale(1)" },
    ], { duration: 2200, easing: "ease-out" }), d);
  },
};

// ---- Shared pieces ----
function rise(diff) {
  const d = makeDelta(diff);
  done(play(d, [
    { opacity: 0, transform: "translateY(50%)" }, { opacity: 1, transform: "translateY(0)", offset: .15 },
    { opacity: 1, transform: "translateY(0)", offset: .6 }, { opacity: 0, transform: "translateY(-150%)" },
  ], { duration: 2000, easing: "ease-out" }), d);
}
function shake() {
  play(box, [
    { transform: "none" }, { transform: "translate(-12px,6px) rotate(-2deg)" }, { transform: "translate(10px,-4px) rotate(2deg)" },
    { transform: "translate(-8px,4px) rotate(-1deg)" }, { transform: "translate(6px,0) rotate(1deg)" }, { transform: "none" },
  ], { duration: 420, easing: "linear", fill: "none" });
}
function glow(ms) { box.classList.add("jackpot"); later(() => box.classList.remove("jackpot"), ms); }
function bits(color, char, n) {
  for (let i = 0; i < n; i++) {
    const b = document.createElement("div");
    b.className = "bit"; b.textContent = char(i); b.style.color = color;
    box.appendChild(b);
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.4, dist = 140 + Math.random() * 130;
    const x = Math.cos(ang) * dist, y = Math.sin(ang) * dist * 0.7;
    done(play(b, [
      { opacity: 1, transform: "translate(-50%,-50%) scale(.4)" },
      { opacity: 1, transform: `translate(calc(-50% + ${x * .7}px), calc(-50% + ${y * .7 - 40}px)) scale(1.1) rotate(${x / 6}deg)`, offset: .45 },
      { opacity: 0, transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y + 60}px)) scale(.8) rotate(${x / 4}deg)` },
    ], { duration: 900 + Math.random() * 300, easing: "cubic-bezier(.2,.7,.4,1)" }), b);
  }
}
function sparkles(ch) {
  for (let i = 0; i < 14; i++) {
    const e = document.createElement("div");
    e.className = "spark"; e.textContent = ch;
    e.style.left = Math.random() * 100 + "%"; e.style.top = Math.random() * 100 + "%";
    box.appendChild(e);
    done(play(e, [
      { opacity: 0, transform: "translate(-50%,-50%) scale(0) rotate(0)" },
      { opacity: 1, transform: `translate(calc(-50% + ${rnd() * 110}px), calc(-50% + ${rnd() * 75}px)) scale(1.3) rotate(90deg)`, offset: .4 },
      { opacity: 0, transform: `translate(calc(-50% + ${rnd() * 180}px), calc(-50% + ${rnd() * 120}px)) scale(.4) rotate(180deg)` },
    ], { duration: 1100, delay: Math.random() * 400, easing: "ease-out" }), e);
  }
}

// Plays the chosen animation for a change of `diff`.
function celebrate(diff, prevText) {
  (ANIM[s.anim] ?? ANIM.bounce)(diff, prevText);
  // Big win: adding 1,000,000 or more also gets the gold glow and sparkles.
  if (s.bigwin && diff >= 1000000 && s.anim !== "jackpot") { glow(1400); sparkles("✨"); }
}

function apply(next) {
  const old = s;
  s = { ...s, ...next };
  if (!ANIMS.includes(s.anim)) s.anim = "bounce";
  drawLook();
  if (!started || old.amount === s.amount) {
    // First load or a look change: redraw without a celebration.
    if (!started || old.prefix !== s.prefix || old.suffix !== s.suffix || old.anim !== s.anim || old.short !== s.short) {
      cancelAnimationFrame(raf);
      shown = s.amount;
      numEl.textContent = fmt(shown);
    }
    return;
  }
  const prevText = `${old.amount < 0 ? "-" : ""}${s.prefix}${body(old.amount)}${s.suffix}`;
  celebrate(s.amount - old.amount, prevText);
}

function start() {
  started = true;
  box.animate([{ opacity: 0, transform: "translateY(-16px) scale(.9)" }, { opacity: 1, transform: "translateY(2px) scale(1.03)", offset: 0.7 }, { opacity: 1, transform: "none" }], { duration: 450, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
}

// The dashboard preview sends changes this way, so you see them animate.
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "money") apply(e.data.value);
  // "Try it": plays the animation with a pretend amount; the total stays the same.
  if (e.data.type === "money-demo" && started) celebrate(Number(e.data.diff) || 100000, fmt(s.amount));
});

(async () => {
  apply({});
  await document.fonts.ready.catch(() => null);
  if (q.get("g") && q.get("api")) {
    const url = `${q.get("api")}/public/money-counter/${q.get("g")}`;
    const load = () => fetch(url, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((v) => v && apply(v)).catch(() => null);
    await load();
    start();
    setInterval(load, 1000);
  } else {
    start();
  }
})();
</script>
</body>
</html>
