<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Socials Sticker Bar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
<style>
/* OBS browser source, 1920x1080, see-through background.
   Settings come from the address (setup.html builds it):
   show=twitch,kick,youtube   which ones, in order. Next to each other with the
                              same name, they share one name, like the example.
   hold=0       seconds it stays up (0 = stays until you hide it)
   every=0      minutes before it pops up again (0 = once)
   pos=left|center|right, size=100 (percent), and a name per platform: kick=Name&twitch=Name... */
:root { --tile: 74px; --gap: 7px; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body.preview { background: repeating-conic-gradient(#3a3d44 0 25%, #30333a 0 50%) 0 0 / 40px 40px; }
.row { position: fixed; bottom: 70px; display: flex; align-items: center; gap: 34px; white-space: nowrap; }
.row.left { left: 70px; transform-origin: bottom left; }
.row.right { right: 70px; transform-origin: bottom right; }
.row.center { left: 50%; transform-origin: bottom center; }
.group { display: flex; align-items: center; gap: var(--gap); }

/* App tile: brand color, white sticker border, thin black edge */
.tile { width: var(--tile); height: var(--tile); box-sizing: border-box; border-radius: 22px; border: 6px solid #fff; display: grid; place-items: center;
  box-shadow: 0 0 0 3.5px #000, 0 8px 16px rgba(0,0,0,.45); opacity: 0; }
.tile svg { width: 64%; height: 64%; }

/* Name: white comic letters with a thick black outline */
.name { font-family: "Bangers", "Impact", sans-serif; font-size: 80px; line-height: 1; letter-spacing: .02em; color: #fff; margin-left: 6px; padding-top: 6px;
  -webkit-text-stroke: 12px #000; paint-order: stroke fill; filter: drop-shadow(0 6px 6px rgba(0,0,0,.45)); opacity: 0; }
</style>
</head>
<body>
<div class="row left" id="row"></div>
<script>
// Tile color and logo for each platform.
const PLATFORMS = {
  twitch: { bg: "#9146ff", fg: "#fff",
    icon: '<path d="M4.3 2 2.5 6.6v13.6h5V23h2.8l2.8-2.8h4.2l5.6-5.6V2H4.3zm16 11.8-3.3 3.3h-5.2l-2.8 2.8v-2.8H4.6V4h15.7v9.8zM15.6 7.1h1.9v5.6h-1.9zm-5.2 0h1.9v5.6h-1.9z"/>' },
  kick: { bg: "#0b0b0b", fg: "#53fc18",
    icon: '<path d="M3 3h6v5h2V6h2V4h2V3h6v6h-2v2h-2v2h2v2h2v6h-6v-1h-2v-2h-2v-2H9v5H3z"/>' },
  youtube: { bg: "#ff0033", fg: "#fff",
    icon: '<path fill-rule="evenodd" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.75 15.02V8.98L15.5 12z"/>' },
  instagram: { bg: "radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%)", fg: "#fff",
    icon: '<g fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/></g><circle cx="17.4" cy="6.6" r="1.3"/>' },
  tiktok: { bg: "#0b0b0b", fg: "#fff", glitch: true,
    icon: '<path d="M16.6 2h-3.3v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9.2a6.3 6.3 0 1 0 5.3 6.2V8.6a8 8 0 0 0 4.7 1.5V6.8A4.8 4.8 0 0 1 16.6 2z"/>' },
  discord: { bg: "#5865f2", fg: "#fff",
    icon: '<path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.2a18.3 18.3 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9 0 13.6.3 18.1a19.9 19.9 0 0 0 6 3l1.3-2a13 13 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 11.8 0l.5.4c-.6.4-1.3.7-2 1l1.3 2a19.8 19.8 0 0 0 6-3c.4-5.3-.7-9.8-3.4-13.7zM8.5 15.4c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4z"/>' },
  x: { bg: "#0b0b0b", fg: "#fff",
    icon: '<path d="M18.2 2.3h3.4l-7.4 8.4 8.8 11h-6.8l-5.3-6.9-6.1 6.9H1.4l7.9-9L1 2.3h7l4.8 6.3 5.4-6.3zm-1.2 17.4h1.9L7.1 4.2H5.1z"/>' },
};
const DEFAULT_NAME = "";

const q = new URLSearchParams(location.search);
const show = (q.get("show") || "twitch,kick,youtube,tiktok,x,discord").split(",").map((s) => s.trim().toLowerCase()).filter((s) => PLATFORMS[s] && (q.get(s) || DEFAULT_NAME));
const hold = Math.max(0, Number(q.get("hold")) || 0) * 1000;
const every = Math.max(0, Number(q.get("every")) || 0) * 60000;
const pos = ["left", "center", "right"].includes(q.get("pos")) ? q.get("pos") : "left";
const size = Math.min(200, Math.max(30, Number(q.get("size")) || 100)) / 100;
if (q.get("preview") === "1") document.body.classList.add("preview");

const row = document.getElementById("row");
row.className = `row ${pos}`;
row.style.transform = `${pos === "center" ? "translateX(-50%) " : ""}scale(${size})`;

// Platforms next to each other with the same name share one name.
const groups = [];
for (const id of show) {
  const name = (q.get(id) || DEFAULT_NAME).trim();
  const last = groups[groups.length - 1];
  if (last && last.name.toLowerCase() === name.toLowerCase()) last.ids.push(id);
  else groups.push({ name, ids: [id] });
}

const pieces = []; // in the order they pop in
for (const g of groups) {
  const el = document.createElement("div");
  el.className = "group";
  for (const id of g.ids) {
    const p = PLATFORMS[id];
    const t = document.createElement("div");
    t.className = "tile";
    t.style.background = p.bg;
    t.style.color = p.fg;
    const shadow = p.glitch ? ' style="filter: drop-shadow(-1.5px -1px 0 #25f4ee) drop-shadow(1.5px 1px 0 #fe2c55)"' : "";
    t.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"${shadow}>${p.icon}</svg>`;
    el.appendChild(t);
    pieces.push({ el: t, kind: "tile" });
  }
  const n = document.createElement("div");
  n.className = "name";
  n.textContent = g.name;
  el.appendChild(n);
  pieces.push({ el: n, kind: "name" });
  row.appendChild(el);
}


// From the dashboard (Streaming › Socials Overlay): when the settings are
// saved again, reload so the stream shows the new names straight away.
if (q.get("g") && q.get("api")) {
  setInterval(() => {
    fetch(`${q.get("api")}/public/socials-overlay/${q.get("g")}`, { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then((s) => { if (s && s.updatedAt !== q.get("v")) location.replace(`/overlay/socials/${q.get("g")}`); })
      .catch(() => null);
  }, 20000);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const POP = [
  { opacity: 0, transform: "scale(0) rotate(-14deg)" },
  { opacity: 1, transform: "scale(1.18) rotate(4deg)", offset: 0.65 },
  { opacity: 1, transform: "scale(1) rotate(0)" },
];
const SLIDE = [
  { opacity: 0, transform: "translateX(-30px) scale(.85)" },
  { opacity: 1, transform: "translateX(4px) scale(1.04)", offset: 0.7 },
  { opacity: 1, transform: "translateX(0) scale(1)" },
];

function popIn() {
  return Promise.all(
    pieces.map((p, i) =>
      p.el.animate(p.kind === "tile" ? POP : SLIDE, { duration: p.kind === "tile" ? 420 : 460, delay: i * 90, easing: "cubic-bezier(.2,.8,.2,1)", fill: "both" }).finished,
    ),
  );
}
function popOut() {
  const n = pieces.length;
  return Promise.all(
    pieces.map((p, i) =>
      p.el.animate([...(p.kind === "tile" ? POP : SLIDE)].reverse(), { duration: 280, delay: (n - 1 - i) * 50, easing: "cubic-bezier(.6,0,.8,.2)", fill: "both" }).finished,
    ),
  );
}

// While it's up, each tile gives a small hop now and then.
let hopping = null;
function startHops() {
  const tiles = pieces.filter((p) => p.kind === "tile");
  let i = 0;
  hopping = setInterval(() => {
    tiles[i % tiles.length].el.animate(
      [{ transform: "translateY(0)" }, { transform: "translateY(-10px) rotate(-4deg)" }, { transform: "translateY(0)" }],
      { duration: 420, easing: "ease-out", composite: "add" },
    );
    i++;
  }, 2600);
}

(async () => {
  await document.fonts.ready.catch(() => null);
  await sleep(250);
  if (!pieces.length) return; // nothing picked yet
  do {
    await popIn();
    startHops();
    if (!hold) return; // stays up
    await sleep(hold);
    clearInterval(hopping);
    await popOut();
    if (every) await sleep(every);
  } while (every);
})();
</script>
</body>
</html>
