<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Tool</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Lilita+One&family=Bangers&family=Russo+One&family=Black+Ops+One&family=Bebas+Neue&family=Luckiest+Guy&display=swap">
<link rel="stylesheet" href="/overlays/tools.css">
<style>
/* OBS browser source for Streaming › Overlays › stream tools. 1920x1080,
   see-through background. kind=<tool>, g=<server id>, api=<api url>: it checks
   every second and plays each new event once.
   preview=1 (dashboard): {type:"tool", settings, state, live, events} by postMessage. */
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body.preview { background: repeating-conic-gradient(#3a3d44 0 25%, #30333a 0 50%) 0 0 / 40px 40px; }
#root { position: fixed; inset: 0; }
#root.see { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/overlays/qrcode.min.js"></script>
<script src="/overlays/tools-engine.js"></script>
<script>
const q = new URLSearchParams(location.search);
const kind = q.get("kind") || "clip";
const root = document.getElementById("root");
if (q.get("preview") === "1") { document.body.classList.add("preview"); root.dataset.preview = "1"; }
// Sizes are in --u: 1px on a 1920-wide canvas.
const fit = () => root.style.setProperty("--u", innerWidth / 1920 + "px");
fit();
addEventListener("resize", fit);
const fx = ToolsFX.mount(root, kind);

// Line timers up with the server's clock, in case this PC's clock is off.
function fixClock(state, now) {
  if (!state || !now) return state;
  const off = Date.now() - now;
  return state.t0 ? { ...state, t0: state.t0 + off } : state;
}
function fixLive(live, now) {
  if (live && live.gw && now) return { ...live, gw: { ...live.gw, endsAt: live.gw.endsAt + (Date.now() - now) } };
  return live;
}

addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "tool") fx.set(e.data.settings, fixClock(e.data.state, e.data.now), fixLive(e.data.live, e.data.now), e.data.events);
  if (e.data.type === "tool-fire") fx.fire(e.data.event, e.data.data);
});

(async () => {
  await document.fonts.ready.catch(() => null);
  if (q.get("g") && q.get("api")) {
    const url = `${q.get("api")}/public/tool/${kind}/${q.get("g")}`;
    const load = () => fetch(url, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((r) => r && fx.set(r.settings, fixClock(r.state, r.now), fixLive(r.live, r.now), r.events)).catch(() => null);
    await load();
    setInterval(load, 1000);
  }
})();
</script>
</body>
</html>
