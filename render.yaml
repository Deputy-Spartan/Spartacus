services:
  # Bot + API merged into one web service. Runs on Starter (not free) so it
  # never spins down for inactivity — free-tier spin-down was taking the bot
  # offline, and free-tier's shared outbound IP was getting rate-limited by
  # Discord's Cloudflare (a static IP add-on requires a paid plan too).
  - type: web
    name: spartacus-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: RUN_BOT_INLINE
        value: "true"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set manually — Neon/Supabase connection string
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false # your deployed web dashboard URL
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false # optional — flips status to "Updating" the moment you push
      - key: VERCEL_TOKEN
        sync: false # optional — keeps "Updating" until Vercel has published
      - key: VERCEL_PROJECT
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false

  # Dashboard — deploy separately to Vercel (recommended for Next.js) or as
  # a second Render static/web service pointed at apps/web.
