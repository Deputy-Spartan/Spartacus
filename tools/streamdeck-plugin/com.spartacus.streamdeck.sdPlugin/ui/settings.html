<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spartacus</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
      :root {
        --sp-font: "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        --sp-muted: #9aa0aa;
        --sp-line: #3a3d44;
      }
      body,
      sdpi-item,
      .sp-head,
      .sp-note,
      .sp-tip {
        font-family: var(--sp-font);
      }
      .sp-head { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; padding: 0 0 10px; border-bottom: 1px solid var(--sp-line); }
      .sp-head img { width: 30px; height: 30px; border-radius: 50%; }
      .sp-head b { display: block; font-size: 13px; font-weight: 600; color: #f1f2f4; }
      .sp-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--sp-muted); }
      .sp-chip i { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; display: inline-block; }
      .sp-chip.ok { color: #4ade80; } .sp-chip.ok i { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
      .sp-chip.bad { color: #f87171; } .sp-chip.bad i { background: #f87171; }
      .sp-link { margin-left: auto; font-size: 11px; color: #60a5fa; cursor: pointer; text-decoration: none; }
      .sp-note { font-size: 11px; color: var(--sp-muted); margin: 2px 0 10px; line-height: 1.45; }
      .sp-tip { font-size: 11px; color: var(--sp-muted); margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--sp-line); line-height: 1.45; }
      #keyBox.hidden { display: none; }
      [data-field] { display: none; }
      [data-field].on { display: flex; }
    </style>
  </head>
  <body>
    <div class="sp-head">
      <img src="../imgs/plugin/icon.png" alt="" />
      <div>
        <b>Spartacus</b>
        <span class="sp-chip" id="chip"><i></i><span id="chipText">Checking connection…</span></span>
      </div>
      <a class="sp-link" id="change" hidden>Change key</a>
    </div>

    <!-- The connection key is stored once for every Spartacus key. Hidden once it works. -->
    <div id="keyBox">
      <sdpi-item label="Connection key">
        <sdpi-password setting="apiKey" global placeholder="sd_live_…"></sdpi-password>
      </sdpi-item>
      <sdpi-item>
        <sdpi-button id="test">Test connection</sdpi-button>
      </sdpi-item>
      <p class="sp-note">Get a key on the dashboard: Owner Only → 🎛️ Stream Deck → Make a Key. Paste it here once; every Spartacus key uses it.</p>
    </div>

    <!-- Only the fields the current action uses are shown. -->
    <sdpi-item data-field="channel" label="Channel"><sdpi-select setting="channel" datasource="text" hot-reload placeholder="Pick a channel"></sdpi-select></sdpi-item>
    <sdpi-item data-field="liveChannel" label="Live channel"><sdpi-select setting="liveChannel" datasource="text" hot-reload placeholder="Channel to rename"></sdpi-select></sdpi-item>
    <sdpi-item data-field="safeChannel" label="Slowmode in"><sdpi-select setting="safeChannel" datasource="text" hot-reload placeholder="Channel"></sdpi-select></sdpi-item>
    <sdpi-item data-field="voice" label="Lobby"><sdpi-select setting="voice" datasource="voice" hot-reload placeholder="Voice channel to pull from"></sdpi-select></sdpi-item>
    <sdpi-item data-field="role" label="Role"><sdpi-select setting="role" datasource="roles" hot-reload placeholder="Pick a role"></sdpi-select></sdpi-item>
    <sdpi-item data-field="ping" label="Ping"><sdpi-select setting="ping" datasource="roles" hot-reload placeholder="No ping"></sdpi-select></sdpi-item>
    <sdpi-item data-field="module" label="Module"><sdpi-select setting="module" datasource="modules" hot-reload placeholder="Pick a module"></sdpi-select></sdpi-item>
    <sdpi-item data-field="embed" label="Saved embed"><sdpi-select setting="embed" datasource="embeds" hot-reload placeholder="From the Embed Creator"></sdpi-select></sdpi-item>
    <sdpi-item data-field="game" label="Game"><sdpi-textfield setting="game" placeholder="e.g. Rainbow Six Siege"></sdpi-textfield></sdpi-item>
    <sdpi-item data-field="text" label="Message"><sdpi-textarea setting="text" rows="3" placeholder="What Spartacus says"></sdpi-textarea></sdpi-item>
    <sdpi-item data-field="question" label="Question"><sdpi-textfield setting="question" placeholder="GG or nah?"></sdpi-textfield></sdpi-item>
    <sdpi-item data-field="prize" label="Prize"><sdpi-textfield setting="prize" placeholder="Discord Nitro"></sdpi-textfield></sdpi-item>
    <sdpi-item data-field="minutes" label="Minutes"><sdpi-range setting="minutes" min="5" max="240" step="5" default="60" showlabels></sdpi-range></sdpi-item>
    <sdpi-item data-field="count" label="Messages"><sdpi-range setting="count" min="1" max="100" step="1" default="10" showlabels></sdpi-range></sdpi-item>
    <sdpi-item data-field="slow" label="Slowmode"><sdpi-select setting="slow" default="10"><option value="5">5 seconds</option><option value="10">10 seconds</option><option value="30">30 seconds</option><option value="60">1 minute</option></sdpi-select></sdpi-item>
    <sdpi-item data-field="streamer" label="Streamer"><sdpi-textfield setting="streamer" placeholder="Their name"></sdpi-textfield></sdpi-item>
    <sdpi-item data-field="link" label="Link"><sdpi-textfield setting="link" placeholder="https://twitch.tv/… (optional)"></sdpi-textfield></sdpi-item>
    <sdpi-item data-field="note" label="Note"><sdpi-textfield setting="note" placeholder="Optional"></sdpi-textfield></sdpi-item>
    <sdpi-item data-field="stat" label="Counts"><sdpi-select setting="stat" default="kills"><option value="kills">Kills</option><option value="deaths">Deaths</option><option value="both">Both (for a reset key)</option></sdpi-select></sdpi-item>
    <sdpi-item data-field="amount" label="Amount"><sdpi-textfield setting="amount" placeholder="e.g. 100000 (or -5000)"></sdpi-textfield></sdpi-item>
    <sdpi-item data-field="moneyMode" label="When pressed"><sdpi-select setting="moneyMode" default="add"><option value="add">Add the amount</option><option value="set">Set it to the amount</option></sdpi-select></sdpi-item>
    <p class="sp-tip" id="tip"></p>

    <script>
      // Which fields each action uses (kept in step with src/actions.ts).
      const FIELDS = {"raid":[],"safe":["channel","slow"],"golive":["liveChannel","game","safeChannel","slow","embed","channel","ping"],"liveind":["channel","game"],"post":["embed","channel","ping"],"bump":[],"lock":["channel"],"slow":["channel"],"module":["module"],"role":["role"],"squadlock":[],"mute":[],"pull":["voice"],"newsquad":["game"],"online":[],"tickets":[],"claim":[],"apps":[],"giveaway":["prize","minutes","channel"],"purge":["channel","count"],"poll":["question","channel"],"say":["text","channel"],"shout":["streamer","link","note","channel"],"event":[],"sticky":["channel"],"status":["channel","note"],"money":["amount","moneyMode"],"kd":["stat","amount","moneyMode"],"botstat":[],"dslow":["channel"],"dlimit":[],"dlock":[],"dstats":[],"dtimer":["prize","question","channel"],"dxp":["channel"],"dpurge":["channel"],"dmoney":["amount"],"dkd":[],"dmm":[]};
      const TIPS = {"raid":"Read-only chat and paused invites. Press again to undo.","safe":"Pauses invites and turns on slowmode while you stream.","golive":"Live Indicator, Stream Safe and your Go Live post in one press.","liveind":"Renames a channel to 🔴 LIVE while you stream.","post":"Posts a saved embed with a role ping.","bump":"Live countdown. Press to send the bump message.","lock":"Locks or unlocks a channel.","slow":"Off, 5s, 10s, 30s, 1m.","module":"Turns a module on or off.","role":"Gives you a role or takes it away.","squadlock":"Locks the voice channel you're in.","mute":"Mutes everyone in your voice channel but you.","pull":"Moves everyone from a lobby into your channel.","newsquad":"Makes a temp squad for a game and moves you in.","online":"Live online count.","tickets":"Count. Press to open the Tickets page.","claim":"Claims the oldest waiting ticket.","apps":"Count. Press to open them.","giveaway":"Starts a giveaway and counts down.","purge":"Deletes the last few messages.","poll":"Posts a 👍 / 👎 poll.","say":"Posts a message as Spartacus.","shout":"Posts a shoutout card for a streamer.","event":"Starts your next event and pings sign-ups.","sticky":"Moves a sticky back to the bottom.","status":"Live, Be right back, Offline.","money":"Adds the amount to your money counter on stream (a minus amount takes away), or sets it.","kd":"Adds to your kills or deaths on stream (a minus amount takes away), or sets them. Pick Both and Set with 0 for a reset key.","botstat":"Is Spartacus online, and its ping.","dslow":"Turn for seconds. Press to turn it off.","dlimit":"Turn for your voice channel's limit. Press to lock.","dlock":"Turn to pick a channel. Press to lock or unlock it.","dstats":"Turn to flip between live counts.","dtimer":"Turn for minutes, tap for giveaway or poll, press to start.","dxp":"Turn 1x to 3x. Press for an hour of boosted XP.","dpurge":"Turn for how many. Press twice to clear.","dmoney":"Turn to add or take away the amount per click. Press twice to reset to 0.","dkd":"Turn to add or take away kills. Press for +1 death.","dmm":"Press to open or close matchmaking."};
      const client = SDPIComponents.streamDeckClient;
      const chip = document.getElementById("chip");
      const chipText = document.getElementById("chipText");
      const keyBox = document.getElementById("keyBox");
      const change = document.getElementById("change");

      client.getConnectionInfo().then((info) => {
        const id = info.actionInfo.action.split(".").pop();
        for (const f of FIELDS[id] ?? []) document.querySelectorAll(`[data-field="${f}"]`).forEach((el) => el.classList.add("on"));
        document.getElementById("tip").textContent = TIPS[id] ?? "";
      });

      function setStatus(ok, text) {
        chip.className = "sp-chip " + (ok === true ? "ok" : ok === false ? "bad" : "");
        chipText.textContent = text;
        // Once connected, the key field folds away; Change key brings it back.
        keyBox.classList.toggle("hidden", ok === true);
        change.hidden = ok !== true;
      }
      function test() {
        setStatus(null, "Checking connection…");
        client.send("sendToPlugin", { event: "test" });
      }
      document.getElementById("test").addEventListener("click", test);
      change.addEventListener("click", () => {
        keyBox.classList.remove("hidden");
        change.hidden = true;
      });
      client.sendToPropertyInspector.subscribe((ev) => {
        const p = ev.payload || {};
        if (p.event === "test") setStatus(!!p.ok, p.ok ? p.message : p.message || "Not connected");
      });
      // Re-check after a new key is pasted.
      client.didReceiveGlobalSettings.subscribe(() => setTimeout(test, 300));
      test();
    </script>
  </body>
</html>
